<main class="page fade-in">
  <!-- Sección Hero / Inicio -->
  <section class="Inicio container">
    <div class="Inicio-text">
      <span class="new-badge"></span>
      <h1>“Educamos para crear <br><span>inspiramos para emprender.”</span></h1>

      <p class="msg">Impulsa tu carrera profesional conectando con proyectos reales y formación especializada.</p>

      <!-- Botón de Acción Principal -->
      <div class="actions">
        <button class="btn primary" routerLink="/articulos">Explorar áreas</button>
        <button class="btn ghost">Saber más</button>
      </div>

      <!-- Área de Personalización (Glass Card) -->
      <div class="card suggestion">
        <div class="dash-header">
          <h2>Cursos Personalizados</h2>
          <div class="notify-bar">
            <button id="notifyBtn" class="btn-notify">🔔 Activar alertas</button>
          </div>
        </div>

        <p class="slogan">Selecciona tus <strong>áreas de interés</strong> (máx. 3) para personalizar tu feed.</p>

        <div class="interests">
          <label class="interest-chip"><input type="checkbox" name="interest" value="Marketing"> Marketing</label>
          <label class="interest-chip"><input type="checkbox" name="interest" value="Finanzas"> Finanzas</label>
          <label class="interest-chip"><input type="checkbox" name="interest" value="Tecnología"> Tecnología</label>
          <label class="interest-chip"><input type="checkbox" name="interest" value="Arquitectura"> Arquitectura</label>
          <label class="interest-chip"><input type="checkbox" name="interest" value="Música"> Música</label>
          <label class="interest-chip"><input type="checkbox" name="interest" value="Gastronomía"> Gastronomía</label>
        </div>

        <div id="coursesArea" class="courses-grid">
          <!-- Aquí se cargarán los cursos dinámicamente -->
        </div>
      </div>
    </div>

    <!-- Imagen con efecto de flotación -->
    <div class="Inicio-img">
      <img src="assets/UNDERTAKE.png" alt="Undertake Logo" class="logo-main" />
    </div>
  </section>
</main>
